<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtShare — Create</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">A</span> ArtShare</a>
    <div class="search"><span>⌕</span><input type="search" placeholder="Search art, artists, tags..."></div>
    <nav class="top-actions"><a href="explore.html">Explore</a><a href="create.html" class="create-button">＋ Create</a><a href="profile.html">Profile</a><button id="logoutBtn" class="ghost-button">Log out</button></nav>
  </header>
  <main class="page narrow">
    <div class="section-heading"><div><p class="eyebrow">CREATE</p><h1>Share artwork</h1><p>Post something you're proud of.</p></div></div>
    <form id="createPostForm" class="form-card">
      <label>Artwork image
        <input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp" required>
      </label>
      <div id="preview" class="upload-preview">Choose an image to preview it here.</div>
      <label>Title <input id="title" type="text" maxlength="120" placeholder="Give your artwork a name" required></label>
      <label>Description <textarea id="description" maxlength="2000" rows="5" placeholder="Tell people about it..."></textarea></label>
      <label>Tags <input id="tags" type="text" maxlength="300" placeholder="digital, character, landscape"></label>
      <button class="primary-button full" type="submit">Publish artwork</button>
      <p id="formStatus" class="status"></p>
    </form>
  </main>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/posts.js"></script>
</body>
</html>
