<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create • ArtShare</title><link rel="stylesheet" href="./css/main.css"></head><body><header class="topbar"><a class="brand" href="./index.html">ArtShare</a><nav><a href="./explore.html">Explore</a><a href="./create.html">Create</a><a href="./profile.html">Profile</a></nav></header><main class="container narrow"><section class="card"><p class="eyebrow">CREATE</p><h1>Post your artwork</h1><form id="postForm"><label>Artwork<input id="image" type="file" accept="image/jpeg,image/png,image/webp" required></label><div id="previewWrap" class="preview-wrap hidden"><img id="preview" alt="Artwork preview"></div><label>Title<input id="title" maxlength="120" required></label><label>Description<textarea id="description" maxlength="2000" rows="5"></textarea></label><label>Tags <span class="muted">(comma separated)</span><input id="tags" maxlength="300" placeholder="digital, character, fanart"></label><button class="button primary">Publish</button></form><p id="status" class="status"></p></section></main><script type="module" src="./js/posts.js"></script></body></html>
