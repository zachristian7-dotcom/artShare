<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtShare — Explore</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">A</span> ArtShare</a>
    <div class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Search art, artists, tags..."></div>
    <nav class="top-actions">
      <a href="explore.html">Explore</a>
      <a href="create.html" class="create-button">＋ Create</a>
      <a href="profile.html">Profile</a>
      <button id="logoutBtn" class="ghost-button">Log out</button>
    </nav>
  </header>
  <main class="page">
    <div class="section-heading">
      <div><p class="eyebrow">DISCOVER</p><h1>Explore artwork</h1><p>Find something new.</p></div>
    </div>
    <div class="tag-row">
      <button class="tag active">All</button><button class="tag">Digital</button>
      <button class="tag">Traditional</button><button class="tag">Pixel Art</button>
      <button class="tag">Illustration</button><button class="tag">Photography</button>
    </div>
    <section id="feed" class="post-grid"></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
