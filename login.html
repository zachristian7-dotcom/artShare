<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtShare — Sign in</title><link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand centered" href="index.html"><span class="brand-mark">A</span> ArtShare</a>
    <h1>Welcome back.</h1><p>Sign in to continue to ArtShare.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required></label>
      <label>Password<input id="password" type="password" required></label>
      <button class="primary-button full">Sign in</button>
      <p id="authStatus" class="status"></p>
    </form>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
